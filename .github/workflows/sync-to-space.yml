name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://$HF_TOKEN@huggingface.co/spaces/<HF_USERNAME>/financial_qa_rag_ft || true
          git push --force space HEAD:main
